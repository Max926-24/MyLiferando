services:
  postgres:
    image: postgres:16
    container_name: myliferando-db
    environment:
      POSTGRES_DB: myliferando
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - myliferando-data:/var/lib/postgresql/data

volumes:
  myliferando-data:
  
spring:
  application:
    name: MyLiferando

  datasource:
    url: jdbc:postgresql://localhost:5433/myliferando
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate   # таблицы создаёт Flyway (db/migration), Hibernate только сверяет их с сущностями
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
spring:
  application:
    name: MyLiferando

  datasource:
    url: jdbc:postgresql://localhost:5433/myliferando
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate   # таблицы создаёт Flyway (db/migration), Hibernate только сверяет их с сущностями
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  # Учебный ключ для подписи токенов (не короче 32 символов). На настоящем сервере его хранят вне кода и в git не кладут.
  secret: myliferando-learning-secret-key-change-me-0123456789
  expiration-minutes: 60
